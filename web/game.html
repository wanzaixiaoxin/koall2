<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>英雄守卫战 · 战斗</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #07080F; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  #wrap {
    position: relative; height: 100vh; margin: 0 auto;
    aspect-ratio: 1080 / 1920; max-width: 100vw;
  }
  @media (max-aspect-ratio: 1080/1920) { #wrap { width: 100vw; height: auto; } }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  canvas.shake { animation: shake .12s linear; }
  @keyframes shake { 25% { transform: translate(3px,0); } 50% { transform: translate(-3px,0); } 75% { transform: translate(2px,0); } }

  .hud { position: absolute; left: 4%; right: 4%; pointer-events: none; }
  #hudtop { top: 2.2%; }
  .bar { position: relative; height: 12px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; margin-bottom: 8px; }
  .bar > div { height: 100%; border-radius: 6px; transition: width .15s; }
  #wallbar { background: #3D4470; }
  #xpbar { background: #35E0C3; }
  #walltext {
    position: absolute; right: 6px; top: -1px; font-size: 10px; line-height: 14px;
    color: #F5F5FA; text-shadow: 0 1px 2px #000; letter-spacing: .03em;
  }
  #hudtext { color: #F5F5FA; font-size: 13px; text-shadow: 0 1px 4px #000; letter-spacing: .05em; }
  .hudrow { display: flex; justify-content: space-between; align-items: center; }

  #speedbtn {
    pointer-events: auto; /* .hud 整体不拦截指针，按钮单独放行 */
    min-width: 52px; padding: 3px 10px; border-radius: 999px; cursor: pointer;
    border: 1.5px solid #3D4470; background: rgba(18,20,43,.85); color: #F5F5FA;
    font-size: 13px; font-weight: 700; letter-spacing: .05em;
  }
  #speedbtn:hover { border-color: #35E0C3; }
  #speedbtn.fast { border-color: #35E0C3; color: #35E0C3; }

  #banner {
    position: absolute; top: 22%; width: 100%; text-align: center;
    color: #FFD54F; font-size: 30px; font-weight: 700; letter-spacing: .2em;
    text-shadow: 0 2px 12px rgba(0,0,0,.8); opacity: 0; transition: opacity .3s;
    pointer-events: none;
  }
  #banner.show { opacity: 1; }

  #cards {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px;
    background: rgba(7,8,15,.72); backdrop-filter: blur(3px);
  }
  #cards.show { display: flex; }
  #cards .title { color: #FFD54F; font-size: 26px; letter-spacing: .35em; font-weight: 700; }
  #cards .row { display: flex; gap: 22px; }
  .card {
    width: 210px; padding: 26px 18px 22px; border-radius: 16px; cursor: pointer;
    background: #12142B; border: 2px solid #F5F5FA; text-align: center;
    transition: transform .12s, box-shadow .12s; position: relative;
  }
  .card:hover { transform: translateY(-6px) scale(1.03); box-shadow: 0 8px 30px rgba(53,224,195,.25); }
  .card .key {
    position: absolute; top: 8px; left: 12px; color: rgba(255,255,255,.35); font-size: 12px;
    border: 1px solid rgba(255,255,255,.3); border-radius: 4px; padding: 1px 6px;
  }
  .card .tag {
    display: inline-block; font-size: 11px; letter-spacing: .2em; padding: 2px 10px;
    border-radius: 999px; margin-bottom: 10px; color: #0B0C1D; font-weight: 700;
  }
  .card .cname { color: #F5F5FA; font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  .card .ceff { color: rgba(245,245,250,.65); font-size: 14px; }
  .card.t-bullet .tag { background: #4FC3F7; }
  .card.t-wall .tag { background: #3D4470; color: #F5F5FA; }
  .card.t-form .tag { background: #B388FF; }
  .card.t-passive .tag { background: #F5F5FA; }
  .card.t-bullet { border-color: #4FC3F7; }
  .card.t-form { border-color: #B388FF; }
  .card.t-wall { border-color: #3D4470; }

  #gameover {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: rgba(7,8,15,.85);
  }
  #gameover.show { display: flex; }
  #gameover .big { color: #F5F5FA; font-size: 44px; font-weight: 800; letter-spacing: .3em; }
  #gameover .stars { color: #FFD54F; font-size: 40px; letter-spacing: .2em; }
  #gameover .sub { color: rgba(245,245,250,.6); font-size: 15px; }
  #gameover button {
    margin-top: 10px; padding: 12px 44px; font-size: 18px; border: none; border-radius: 999px;
    background: #35E0C3; color: #0B0C1D; font-weight: 700; cursor: pointer;
  }
  #gameover button.ghost { background: transparent; border: 1.5px solid #3D4470; color: #F5F5FA; margin-left: 10px; }
  #hint { position: absolute; bottom: 1.6%; width: 100%; text-align: center; color: rgba(245,245,250,.4); font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div class="hud" id="hudtop">
      <div class="bar"><div id="wallbar" style="width:100%"></div><span id="walltext"></span></div>
      <div class="bar"><div id="xpbar" style="width:0%"></div></div>
      <div class="hudrow"><div id="hudtext"></div><button id="speedbtn">1x</button></div>
    </div>
    <div id="banner"></div>
    <div id="hint">点击/拖动移动（或 WASD / 方向键）· 数字键 1~3 选卡</div>
    <div id="cards"></div>
    <div id="gameover"></div>
  </div>
  <script src="./bundle.js?v=16"></script>
</body>
</html>
